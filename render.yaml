# Cada serviço tem DATABASE_URL própria (pode ser o mesmo PostgreSQL: cada um usa
# só o próprio schema) e se integra aos outros por eventos Kafka e chamadas REST.
services:
  - type: web
    name: wellflix-identidade
    runtime: python
    plan: free
    buildCommand: pip install -r backend/services/identidade/requirements.txt
    startCommand: uvicorn backend.services.identidade.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        sync: false
      - key: KAFKA_SASL_MECHANISM
        sync: false
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false
      - key: KAFKA_TOPIC_REPLICATION
        sync: false
      - key: KAFKA_SSL_CA_PEM
        sync: false
      - key: KAFKA_SSL_CERT_PEM
        sync: false
      - key: KAFKA_SSL_KEY_PEM
        sync: false

  - type: web
    name: wellflix-conta
    runtime: python
    plan: free
    buildCommand: pip install -r backend/services/conta/requirements.txt
    startCommand: uvicorn backend.services.conta.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        sync: false
      - key: KAFKA_SASL_MECHANISM
        sync: false
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false
      - key: KAFKA_TOPIC_REPLICATION
        sync: false
      - key: KAFKA_SSL_CA_PEM
        sync: false
      - key: KAFKA_SSL_CERT_PEM
        sync: false
      - key: KAFKA_SSL_KEY_PEM
        sync: false

  - type: web
    name: wellflix-profissionais
    runtime: python
    plan: free
    buildCommand: pip install -r backend/services/profissionais/requirements.txt
    startCommand: uvicorn backend.services.profissionais.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        sync: false
      - key: KAFKA_SASL_MECHANISM
        sync: false
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false
      - key: KAFKA_TOPIC_REPLICATION
        sync: false
      - key: KAFKA_SSL_CA_PEM
        sync: false
      - key: KAFKA_SSL_CERT_PEM
        sync: false
      - key: KAFKA_SSL_KEY_PEM
        sync: false
      - key: IDENTIDADE_API_URL
        sync: false
      - key: CATALOGO_API_URL
        sync: false

  - type: web
    name: wellflix-catalogo
    runtime: python
    plan: free
    buildCommand: pip install -r backend/services/catalogo/requirements.txt
    startCommand: uvicorn backend.services.catalogo.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        sync: false
      - key: KAFKA_SASL_MECHANISM
        sync: false
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false
      - key: KAFKA_TOPIC_REPLICATION
        sync: false
      - key: KAFKA_SSL_CA_PEM
        sync: false
      - key: KAFKA_SSL_CERT_PEM
        sync: false
      - key: KAFKA_SSL_KEY_PEM
        sync: false
      - key: PROFISSIONAIS_API_URL
        sync: false
      - key: CONTA_API_URL
        sync: false

  - type: web
    name: wellflix-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_AUTH_API_URL
        sync: false
      - key: VITE_ACCOUNT_API_URL
        sync: false
      - key: VITE_CREATOR_API_URL
        sync: false
      - key: VITE_CATALOG_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
